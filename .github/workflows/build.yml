name: Build Glove80 firmware
on:
  workflow_dispatch:
  push:
    paths: ['firmware/config/**', 'firmware/telemetry/**', '.github/workflows/build.yml']
  pull_request:
    paths: ['firmware/config/**', 'firmware/telemetry/**', '.github/workflows/build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        variant: [baseline, telemetry]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: moergo-sc/zmk
          ref: 11454d23596afbdb06380a1125371b19ab65675c
          path: firmware/src
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: moergo-glove80-zmk-dev
          skipPush: true
      - name: Build both halves
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          if [ "$VARIANT" = telemetry ]; then
            nix-build firmware/telemetry -o firmware/result
          else
            nix-build firmware/config -o firmware/result
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: glove80-${{ matrix.variant }}-v25.11
          path: firmware/result/glove80.uf2
